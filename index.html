<!DOCTYPE html>
<html lang="es">
<head>

<title>Skate a la Escuela</title>
<style>
:root{--bg:#4db8ff;--fg:#1c2b3a;--card:rgba(255,255,255,.95);--btn:#e63946;--btnfg:#fff;--alt:#2a9d8f;box-sizing:border-box}

canvas{display:block;width:100%;height:100%}

.card h1{margin:0 0 4px;font-size:30px;line-height:1.1}.card h2{margin:0 0 6px;font-size:26px}
.card p{margin:6px 0 14px;opacity:.85}
button{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin:8px 0;background:var(--btn);color:var(--btnfg);font-size:18px;font-weight:800;cursor:pointer;font-family:inherit}
button.alt{background:var(--alt)}button.g{background:#7a8594}button:disabled{opacity:.4}
.lv{display:flex;justify-content:space-between;align-items:center;background:var(--alt)}
.big{font-size:40px;letter-spacing:6px}
canvas{touch-action:none}.card{max-height:92vh;overflow-y:auto;touch-action:pan-y}
#pz{position:absolute;right:14px;top:calc(58px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:50%;padding:0;margin:0;font-size:20px;pointer-events:auto;background:rgba(0,0,0,.4);color:#fff}
.sk{display:flex;align-items:center;gap:6px;margin:6px 0;text-align:left}.sk b{flex:1;font-size:15px}.sk button{width:auto;margin:0;padding:9px 12px;font-size:15px}
.sw{width:16px;height:30px;border-radius:5px;border:2px solid rgba(0,0,0,.2)}
.gold{background:linear-gradient(160deg,#fff4c2,#ffd166)!important;color:#3a2a00!important}@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}.cf{position:fixed;top:0;font-size:24px;animation:fall linear infinite;pointer-events:none}
.dark{background:#000!important;color:#fff!important;box-shadow:none!important;border:1px solid #333}
:root{--edge:#a9bdd0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--edge:#0a121f}}
:root[data-theme="dark"]{--edge:#0a121f}
#ui{perspective:1000px;perspective-origin:50% 40%}
.card{background-image:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,0) 45%);border:1px solid rgba(255,255,255,.22);transform:rotateX(var(--rx,6deg)) rotateY(var(--ry,0deg));transform-origin:50% 60%;box-shadow:0 1px 0 var(--edge),0 2px 0 var(--edge),0 3px 0 var(--edge),0 4px 0 var(--edge),0 5px 0 var(--edge),0 6px 0 var(--edge),0 7px 0 var(--edge),0 8px 0 var(--edge),0 9px 0 var(--edge),0 30px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);animation:pop .75s cubic-bezier(.2,1.3,.4,1) backwards}
.gold{--edge:#b88a00}
@keyframes pop{from{transform:translateY(70px) translateZ(-400px) rotateX(55deg) scale(.5);opacity:0}}
@keyframes flt{0%,100%{transform:rotateX(var(--rx,6deg)) rotateY(var(--ry,0deg)) translateY(0)}50%{transform:rotateX(var(--rx,6deg)) rotateY(var(--ry,0deg)) translateY(-8px)}}
.card h1,.card h2{text-shadow:0 1px 0 rgba(0,0,0,.28),0 2px 0 rgba(0,0,0,.24),0 3px 0 rgba(0,0,0,.2),0 4px 0 rgba(0,0,0,.16),0 10px 14px rgba(0,0,0,.35)}

button:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.42),0 7px 9px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.3)}
.card button{animation:rise .5s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes rise{from{transform:translateY(40px) scale(.85);opacity:0}}
.card button:nth-of-type(1){animation-delay:0.18s}.card button:nth-of-type(2){animation-delay:0.24s}.card button:nth-of-type(3){animation-delay:0.30s}.card button:nth-of-type(4){animation-delay:0.36s}.card button:nth-of-type(5){animation-delay:0.42s}.card button:nth-of-type(6){animation-delay:0.48s}.card button:nth-of-type(7){animation-delay:0.54s}.card button:nth-of-type(8){animation-delay:0.60s}.card button:nth-of-type(9){animation-delay:0.66s}.card button:nth-of-type(10){animation-delay:0.72s}.card button:nth-of-type(11){animation-delay:0.78s}.card button:nth-of-type(12){animation-delay:0.84s}.card button:nth-of-type(13){animation-delay:0.90s}.card button:nth-of-type(14){animation-delay:0.96s}

.card:not(.gold):not(.dark){background:#fff8e7;color:#2a1250;border:4px solid #2a1250;border-radius:26px;box-shadow:0 8px 0 #2a1250,0 26px 34px rgba(0,0,0,.35)}
.card h1,.card h2{font-family:"Arial Black","Trebuchet MS",Impact,system-ui,sans-serif;font-weight:900;text-transform:uppercase;text-shadow:0 3px 0 #ffd23f}

.card button:active:not(:disabled),.mm button:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #2a1250,0 3px 6px rgba(0,0,0,.25)}
#ui:has(.mm){padding:0;align-items:stretch;background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.5),rgba(255,214,102,.22) 40%,rgba(120,60,200,.38))}
.mm{position:relative;width:100%;max-width:470px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box;overflow:hidden}
.mm>i{position:absolute;top:100%;font-size:26px;opacity:.85;animation:up linear infinite;pointer-events:none;font-style:normal}
@keyframes up{to{transform:translateY(-120vh) rotate(360deg)}}
.logo{text-align:center;position:relative;z-index:1}

.l1{font-size:clamp(30px,9.5vw,50px);color:#7cf26a}
.l2{font-size:clamp(40px,13vw,68px);color:#ffd23f;animation-delay:-1.4s!important}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(2.5deg) translateY(-4px)}}

.tile{background:var(--c);color:#fff;padding:8px 6px!important;margin:0!important;display:flex!important;flex-direction:column;align-items:center;width:auto!important;line-height:1.05}

.tile:disabled{filter:grayscale(.7);opacity:.75}
.dock{display:flex;gap:10px;justify-content:center;padding-top:6px;position:relative;z-index:1}
.dock button{width:auto!important;margin:0!important;flex:1;background:#fff;color:#2a1250;font-size:26px;padding:6px!important;display:flex!important;flex-direction:column;align-items:center}
.dock small{font-size:11px}
.shop{width:100%;max-width:1000px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
#ui:has(.shop){padding:0;align-items:stretch;background:linear-gradient(160deg,rgba(255,214,102,.6),rgba(120,60,200,.65))}
.shtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.shtop .back{width:auto!important;margin:0!important;padding:8px 18px!important;background:#fff;color:#2a1250;font-size:22px}
.tabs{display:flex;align-items:flex-end;gap:6px;padding-left:4px;position:relative;z-index:2;margin-bottom:-4px}
.tab{margin:0!important;width:auto!important;flex:1;border-radius:18px 18px 0 0!important;border-bottom:none!important;box-shadow:none!important;background:#c9b6f2;color:#4b2f86;padding:10px 6px!important;font-size:16px}
.tab.on{background:#fff8e7;color:#2a1250;flex:1.35;padding:16px 6px 12px!important;font-size:22px;margin-bottom:-4px!important;position:relative;z-index:3}
.shpanel{position:relative;flex:1;min-height:0;background:#fff8e7;border:4px solid #2a1250;border-radius:0 22px 22px 22px;box-shadow:0 8px 0 #2a1250,0 24px 30px rgba(0,0,0,.3);display:flex;overflow:hidden}
.shgrid{flex:1;min-width:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 6px 16px 14px;align-content:start;touch-action:pan-y;scrollbar-width:none}
.shgrid::-webkit-scrollbar{display:none}
.sbar{width:16px;margin:12px 10px 12px 2px;background:#eadfc4;border:3px solid #2a1250;border-radius:10px;position:relative;flex:none}
.sbar i{position:absolute;left:0;right:0;top:0;height:40px;background:linear-gradient(#ffb703,#ff7a1a);border-radius:6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55)}
.sk2{background:var(--bg2,#fff);border:4px solid #2a1250;border-radius:18px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 #2a1250;min-width:0}
.sk2.eq{box-shadow:0 5px 0 #2a1250,0 0 0 4px #3ddc84}
.sk2 img{width:100%;aspect-ratio:220/260;object-fit:contain;background:radial-gradient(circle,#fff,#ffe9a8);border-radius:12px}
.sk2 b{font-size:13px;color:#2a1250;font-family:"Arial Black",system-ui,sans-serif}
.sk2 button{width:100%!important;margin:0!important;padding:8px!important;font-size:14px!important}
.emo{font-size:60px;aspect-ratio:220/260;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fff,#ffe9a8);border-radius:12px}
.mm>i,.logo span{will-change:transform}
.pvh{aspect-ratio:264/312;border-radius:12px;background:radial-gradient(circle,#fff,#ffe9a8);overflow:hidden}.pvh canvas{width:100%;height:100%;display:block}
#ui:has(.shop){padding:0}
.shop{padding-left:calc(14px + env(safe-area-inset-left,0px));padding-right:calc(14px + env(safe-area-inset-right,0px))}
.shtop .pill{font-size:20px;padding:6px 20px}
.shtop .back{font-size:26px!important;padding:10px 22px!important}
.tab{font-size:19px!important;padding:14px 6px!important}
.tab.on{font-size:28px!important;padding:20px 6px 15px!important}
.shgrid{grid-template-columns:repeat(auto-fill,minmax(min(44%,270px),1fr));gap:18px;padding:20px 10px 24px 20px}
.sbar{width:22px;margin:14px 12px 14px 2px;border-width:4px}
.sk2{padding:11px;gap:8px;border-radius:22px}
.sk2 b{font-size:16px}
.sk2 button{padding:12px!important;font-size:17px!important}
.emo{font-size:96px}
</style>

<body>
<div id="stage"><canvas id="c"></canvas>
<div id="hud"><div class="r"><span id="hl"></span><span id="hs"></span></div><div id="pg"><i id="pgb"></i><b>🏫</b></div><button id="pz">⏸</button></div>
<div id="ui"></div></div>
<script>
const cv=document.getElementById('c'),ui=document.getElementById('ui'),hud=document.getElementById('hud');
let ctx=cv.getContext('2d');
if(!ctx.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
let S=1,WL=620,DPR=1;
var stN=0,lastSt='',mt=0,DPRMAX=1.75,QUAL=2,pAcc=0,pN=0,pT=0,ha='',hb='',hc='';
function resize(){stN=0;DPR=Math.min(devicePixelRatio||1,DPRMAX);const w=innerWidth,h=innerHeight;cv.width=w*DPR;cv.height=h*DPR;S=Math.min(h*DPR/500,w*DPR/620);WL=cv.width/S}
addEventListener('resize',resize);resize();
const R=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};
const rr=(x,y,w,h,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()};
const poly=(p,c)=>{ctx.fillStyle=c;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill()};
const circ=(x,y,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()};
const line=(a,b,c,d,col,w)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,k)=>a+(b-a)*k;
function dk(h,f){if(h.length==4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];const n=parseInt(h.slice(1),16);return 'rgb('+[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v*f)).join(',')+')'}
// ---- guardado y sonido ----
let SV={best:[0,0,0],stars:[0,0,0],unlocked:1,snd:true,coins:0,own:[0],eq:0};
try{const s=JSON.parse(localStorage.getItem('skate-escuela')||'null');if(s)SV=Object.assign(SV,s)}catch(e){}
const save=()=>{try{localStorage.setItem('skate-escuela',JSON.stringify(SV))}catch(e){}};
let AC=null;
function snd(f,d,type,vol,sl){if(!SV.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,AC.currentTime);if(sl)o.frequency.exponentialRampToValueAtTime(sl,AC.currentTime+d);g.gain.setValueAtTime(vol||.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
// ---- personajes ----
const INKC='#1b1f3b';
function lt(h,f){if(h.length==4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];const n=parseInt(h.slice(1),16),m=v=>Math.round(v+(255-v)*f);return 'rgb('+[m(n>>16),m((n>>8)&255),m(n&255)].join(',')+')'}
function celFill(c,x0,y0,x1,y1){
  ctx.fillStyle=c;ctx.fill();if(QUAL<2)return;ctx.save();ctx.clip();
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,'rgba(255,255,255,.3)');g.addColorStop(.36,'rgba(255,255,255,.3)');g.addColorStop(.361,'rgba(255,255,255,0)');g.addColorStop(.62,'rgba(255,255,255,0)');g.addColorStop(.621,'rgba(12,18,70,.2)');g.addColorStop(1,'rgba(12,18,70,.2)');
  ctx.fillStyle=g;ctx.fillRect(Math.min(x0,x1)-80,Math.min(y0,y1)-80,Math.abs(x1-x0)+160,Math.abs(y1-y0)+160);ctx.restore()}
function outline(w,c){ctx.lineJoin=ctx.lineCap='round';ctx.strokeStyle=c||INKC;ctx.lineWidth=w||3;ctx.stroke()}
function rro(x,y,w,h,r,c,lw,oc){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(w>12&&h>10&&typeof c=='string'&&c[0]=='#')celFill(c,x,y,x+w,y+h);else{ctx.fillStyle=c;ctx.fill()}outline(Math.max(2.4,(lw||2)*1.5),oc)}
function cir2(x,y,r,c,lw,oc){ctx.beginPath();ctx.arc(x,y,r,0,7);if(r>6&&typeof c=='string'&&c[0]=='#')celFill(c,x-r,y-r,x+r,y+r);else{ctx.fillStyle=c;ctx.fill()}outline(Math.max(2.4,(lw||2)*1.5),oc)}
function celP(pf,c,x0,y0,x1,y1,lw){pf();celFill(c,x0,y0,x1,y1);outline(lw||3)}
function limb(pts,col,w){
  const path=()=>{ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]))};
  ctx.lineCap=ctx.lineJoin='round';path();ctx.strokeStyle=INKC;ctx.lineWidth=w+6;ctx.stroke();path();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();
  if(QUAL<2)return;ctx.save();ctx.translate(-w*.2,-w*.2);path();ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=w*.28;ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(w*.22,w*.22);path();ctx.strokeStyle='rgba(12,18,70,.2)';ctx.lineWidth=w*.3;ctx.stroke();ctx.restore()}
function hand(hx,hy,a,sk){const dx=Math.sin(a),dy=Math.cos(a);cir2(hx+dx*3-dy*4.5,hy+dy*3+dx*4.5,3,sk,1);cir2(hx,hy,6.4,sk,1.3)}
function shoe(fx,fy,c){
  celP(()=>{ctx.beginPath();ctx.moveTo(fx-9,fy-4);ctx.lineTo(fx-8,fy-14);ctx.quadraticCurveTo(fx+3,fy-19,fx+11,fy-11);ctx.quadraticCurveTo(fx+24,fy-9,fx+24,fy-4);ctx.closePath()},c,fx-9,fy-19,fx+24,fy,2.8);
  rro(fx-10,fy-5,35,7,3.5,'#f6f6f6',1.2);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(fx-1,fy-14);ctx.lineTo(fx+3,fy-11);ctx.moveTo(fx+4,fy-16);ctx.lineTo(fx+8,fy-12);ctx.stroke()}
function leg(hx,hy,fx,fy,col,sc){const l=30,d=Math.min(Math.hypot(fx-hx,fy-hy),2*l-.5),a=Math.acos(d/(2*l)),b=Math.atan2(fy-hy,fx-hx)-a,kx=hx+Math.cos(b)*l,ky=hy+Math.sin(b)*l;limb([[hx,hy],[kx,ky],[fx,fy-4]],col,15);shoe(fx,fy,sc||'#e8a21a')}
function arm(sx,sy,a1,a2,o){const ex=sx+Math.sin(a1)*24,ey=sy+Math.cos(a1)*24,hx=ex+Math.sin(a2)*22,hy=ey+Math.cos(a2)*22;limb([[sx,sy],[ex,ey],[hx,hy]],o.skin,10);limb([[sx,sy],[sx+(ex-sx)*.55,sy+(ey-sy)*.55]],o.shirt,16);hand(hx,hy,a2,o.skin)}
function person(o){
  const p=o.p||0,am=o.amp==null?1:o.amp,shc=o.shoe||'#e8a21a',sk=o.skin,hc=o.hair;ctx.save();ctx.translate(o.x,o.y);
  if(o.st)ctx.scale(1-o.st*.5,1+o.st);
  if(o.fall>0){const u=Math.min(o.fall,1);ctx.translate(-24*u,34*u);ctx.rotate(-u*1.45)}
  let hy=-50,F1,F2,A,B,lean=0;
